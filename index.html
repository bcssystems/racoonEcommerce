<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo digital Racoon">
  <title>Racoon | Catálogo digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="js/version.js"></script>
  <link rel="stylesheet" href="css/ecommerce.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#catalogo" aria-label="Racoon inicio"><span class="brand-mark">R</span><span>RACOON</span></a>
      <a class="header-contact" id="header-contact" target="_blank" rel="noopener"><span>¿Tienes dudas?</span> WhatsApp</a>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-inner">
        <div>
          <p class="eyebrow">Catálogo digital</p>
          <h1>Encuentra lo que necesitas.</h1>
          <p class="hero-copy">Explora nuestros productos y contáctanos directamente por WhatsApp para realizar tu pedido.</p>
        </div>
        <div class="hero-shape" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </section>

    <section id="catalogo" class="container catalog-section">
      <div class="catalog-toolbar">
        <div><p class="eyebrow">Nuestros productos</p><h2>Catálogo</h2></div>
        <div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Buscar productos..." autocomplete="off"></div>
      </div>
      <div id="categories" class="category-list" aria-label="Categorías"></div>
      <div id="catalog-status" class="status-message">Cargando catálogo...</div>
      <div id="products" class="product-grid"></div>
      <div id="catalog-sentinel" aria-hidden="true"></div>
    </section>
  </main>

  <div id="product-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop" data-close-modal></div>
    <article class="modal-card">
      <button class="modal-close" type="button" data-close-modal aria-label="Cerrar">×</button>
      <div id="product-detail" class="detail-layout"></div>
    </article>
  </div>

  <footer class="site-footer"><div class="container">Racoon · Catálogo digital <span id="site-version"></span></div></footer>
  <script type="module" src="js/catalogo.js"></script>
</body>
</html>
